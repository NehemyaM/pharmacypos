# Packaging for the PharmacyPOS desktop application.
#
#   npm run desktop:dir    unpacked build, for local testing
#   npm run desktop:linux  AppImage
#   npm run desktop:win    Windows installer (needs Windows or wine)
#
# The Windows installer is normally produced by CI — see
# .github/workflows/desktop-release.yml — so no one needs a build machine.

appId: com.maxreach.pharmacypos
productName: PharmacyPOS
copyright: Max Reach Pharmacy

directories:
  output: release
  buildResources: desktop/icons

# Ship the compiled server, the built UI and the Electron shell. Source,
# tests and the developer's local database are deliberately excluded.
#
# The runtime dependencies are declared in the root package.json purely so that
# they end up here. electron-builder reads that file to decide what to bundle,
# and with the dependencies living only in server/package.json it packaged no
# node_modules at all — the app started, forked the server, and the server died
# on its first require. Nothing caught it because the desktop suite drives
# `electron .` against the source tree, where node_modules is simply present.
files:
  - desktop/**/*
  - package.json
  - "!**/node_modules/*/{CHANGELOG.md,README.md,README,readme.md,readme}"
  - "!**/node_modules/*/{test,__tests__,tests,powered-test,example,examples}"
  - "!**/*.map"

# server/dist already contains db/schema.sql and tessdata/, both put there by
# the server's build step. Copying the schema again from src would write the
# same destination twice, which fails outright on a clean tree — it only
# appeared to work where a previous build had left the file in place.
extraResources:
  - from: server/dist
    to: app/server/dist
  - from: web/dist
    to: app/web/dist

# A native module cannot be loaded from inside an asar archive, and neither can
# a worker script that a library spawns by path. Everything below is one or the
# other.
asar: true
asarUnpack:
  # Native: compiled against Electron's ABI by npmRebuild below.
  - "**/node_modules/better-sqlite3/**"
  - "**/node_modules/bindings/**"
  - "**/node_modules/file-uri-to-path/**"
  # Native: sharp carries libvips as a platform-specific binary, and prepares
  # every invoice photograph before it is read.
  - "**/node_modules/sharp/**"
  - "**/node_modules/@img/**"
  # tesseract.js forks a worker by file path and loads its WASM core the same
  # way; both must exist as real files on disk.
  - "**/node_modules/tesseract.js/**"
  - "**/node_modules/tesseract.js-core/**"

npmRebuild: true
nodeGypRebuild: false

win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: PharmacyPOS-Setup-${version}.${ext}
  # Unsigned builds show a SmartScreen warning on first run. A code-signing
  # certificate (~₹15,000/year) removes it; without one, tell staff to click
  # "More info" then "Run anyway" the first time.

nsis:
  oneClick: false
  perMachine: true               # a shop PC is shared; install for all users
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: PharmacyPOS
  runAfterFinish: true
  # Never remove the shop's data on uninstall. The database lives in
  # %APPDATA%\PharmacyPOS and must survive an uninstall or a bad update.
  deleteAppDataOnUninstall: false

linux:
  target:
    - AppImage
  category: Office
  artifactName: PharmacyPOS-${version}.${ext}

mac:
  target: dmg
  category: public.app-category.business

publish:
  provider: github
  owner: NehemyaM
  repo: pharmacypos
