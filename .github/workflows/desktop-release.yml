name: Build desktop installers

# Builds the Windows installer on a real Windows runner, so nobody needs a
# Windows machine to produce one. Tag a version and the .exe appears on the
# GitHub release.
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# Or run it by hand from the Actions tab to get an installer without releasing.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write        # needed to attach installers to a release

jobs:
  test:
    name: Verify before packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Smoke test the API
        run: |
          npm run build
          npm run seed
          npm start &
          npx wait-on http://localhost:4000/api/health -t 60000
          npm run verify:api

  build:
    name: Package for ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # better-sqlite3 is native and must match Electron's ABI, not Node's.
      - name: Rebuild native modules for Electron
        run: npx electron-rebuild -f -w better-sqlite3

      - name: Build the application
        run: npm run build

      - name: Package
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.AppImage
            release/*.yml
          if-no-files-found: error
          retention-days: 30

  release:
    name: Attach installers to the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.exe
            artifacts/**/*.AppImage
            artifacts/**/*.yml
          generate_release_notes: true
          body: |
            ## Installing at the shop

            Download **PharmacyPOS-Setup-*.exe** and run it on the counter PC.

            Windows will show a SmartScreen warning because the installer is not
            code-signed — click **More info**, then **Run anyway**.

            Your existing data is untouched: the database lives in
            `%APPDATA%\PharmacyPOS` and is never overwritten by an update.
